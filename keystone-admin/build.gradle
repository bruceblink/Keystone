import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'org.springframework.boot'
    id 'org.graalvm.buildtools.native'
}

// Keep the plain jar for GraalVM nativeCompile classpath; bootJar remains the JVM distribution.
jar {
    enabled = true
}

bootJar {
    archiveFileName = 'keystone-admin.jar'
}

// Build a self-contained GraalVM native executable alongside the JVM bootJar.
graalvmNative {
    binaries {
        main {
            imageName = 'keystone-admin'
            mainClass = 'app.keystone.admin.KeystoneAdminApplication'
            sharedLibrary = false
            fallback = false
            quickBuild = findProperty('nativeQuickBuild')?.toString()?.equalsIgnoreCase('true') ?: false
            // Keep native-image within the memory budget of the local and CI
            // builders; override with -PnativeImageXmx=6g on larger runners.
            jvmArgs("-Xmx${findProperty('nativeImageXmx') ?: '5g'}")
        }
    }
}

def keystoneVersion = project.version.toString()

tasks.named('processResources') {
    filesMatching('application.yml') {
        filter(ReplaceTokens, tokens: [
            keystoneVersion: keystoneVersion
        ])
    }
}

dependencies {
    implementation project(':keystone-framework-spring-boot-starter')
    implementation project(':keystone-domain')

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.register('dbIntegrationTest', Test) {
    description = 'Runs Docker MySQL-backed admin integration tests.'
    group = 'verification'
    dependsOn rootProject.tasks.named('resetDbIntegrationDatabases')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'KEYSTONE_TEST_DATASOURCE_URL',
        System.getenv('KEYSTONE_TEST_DATASOURCE_URL')
            ?: 'jdbc:mysql://localhost:33066/keystone_admin_integration_test?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
    systemProperty 'KEYSTONE_TEST_DATASOURCE_PASSWORD_FILE',
        System.getenv('KEYSTONE_TEST_DATASOURCE_PASSWORD_FILE')
            ?: rootProject.file('docker/.secrets/.database_password.enc').absolutePath
    systemProperty 'KEYSTONE_TEST_DATASOURCE_ENCRYPT_KEY_FILE',
        System.getenv('KEYSTONE_TEST_DATASOURCE_ENCRYPT_KEY_FILE')
            ?: rootProject.file('docker/.secrets/.database_password.key').absolutePath
    systemProperty 'KEYSTONE_TEST_REDIS_PASSWORD_FILE',
        System.getenv('KEYSTONE_TEST_REDIS_PASSWORD_FILE')
            ?: rootProject.file('docker/.secrets/.redis_password.enc').absolutePath
    systemProperty 'KEYSTONE_TEST_REDIS_ENCRYPT_KEY_FILE',
        System.getenv('KEYSTONE_TEST_REDIS_ENCRYPT_KEY_FILE')
            ?: rootProject.file('docker/.secrets/.redis_password.key').absolutePath
    useJUnitPlatform {
        includeTags 'db-integration'
    }
    shouldRunAfter tasks.named('test')
}
