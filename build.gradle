plugins {
    id 'org.springframework.boot' version '3.5.13' apply false
    id 'com.github.spotbugs' version '6.0.27' apply false
}

def integrationDbPasswordFile = file('docker/.secrets/.database_password')
def springBootBom = 'org.springframework.boot:spring-boot-dependencies:3.5.13'

allprojects {
    group = 'app.keystone'
    version = '3.6.2'
}

tasks.register('resetDbIntegrationDatabases', Exec) {
    description = 'Drops and recreates Docker MySQL databases used by integration tests.'
    group = 'verification'
    inputs.file(integrationDbPasswordFile)
    doFirst {
        String password = integrationDbPasswordFile.text.trim()
        String resetSql = [
            'DROP DATABASE IF EXISTS keystone_domain_integration_test;',
            'CREATE DATABASE keystone_domain_integration_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;',
            'DROP DATABASE IF EXISTS keystone_admin_integration_test;',
            'CREATE DATABASE keystone_admin_integration_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
        ].join(' ')
        commandLine 'docker', 'exec', '-e', "MYSQL_PWD=${password}", 'infra_mysql', 'mysql', '-uroot', '-e', resetSql
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'jacoco'
    apply plugin: 'checkstyle'
    apply plugin: 'com.github.spotbugs'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    repositories {
        mavenCentral()
        maven {
            url = 'https://maven.aliyun.com/repository/spring'
            content {
                includeGroupByRegex 'org\\.springframework(\\..*)?'
                includeGroup 'org.springframework.boot'
                includeGroupByRegex 'io\\.spring(\\..*)?'
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-parameters', '-Xlint:deprecation', '-Xlint:unchecked'])
    }

    jacoco {
        toolVersion = '0.8.13'
    }

    checkstyle {
        toolVersion = '10.21.4'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        ignoreFailures = true
    }

    tasks.withType(Checkstyle).configureEach {
        reports {
            xml.required = true
            html.required = true
        }
    }

    // Report-only: keep style findings visible without blocking builds.
    tasks.named('checkstyleMain') {
        ignoreFailures = true
    }

    // Report-only: keep test style findings visible without blocking builds.
    tasks.named('checkstyleTest') {
        ignoreFailures = true
    }

    spotbugs {
        toolVersion = '4.9.8'
        ignoreFailures = true
        showProgress = true
        excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
    }

    // Phase C step 3: make production bug findings fail the build.
    tasks.named('spotbugsMain') {
        ignoreFailures = true
    }

    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        if (name.toLowerCase().contains('test')) {
            auxClassPaths.from(sourceSets.test.compileClasspath)
            auxClassPaths.from(sourceSets.test.runtimeClasspath)
        } else {
            auxClassPaths.from(sourceSets.main.compileClasspath)
            auxClassPaths.from(sourceSets.main.runtimeClasspath)
        }
        reports {
            xml.required = true
            html.required = true
        }
    }

    tasks.named('test') {
        useJUnitPlatform {
            excludeTags 'db-integration'
        }
        def baseArgs = [
            '-Xshare:off',
            '-Dnet.bytebuddy.experimental=true',
            '-Dspring.classformat.ignore=true',
            '-Djdk.net.URLClassPath.disableClassPathURLCheck=true',
            // 抑制 Netty 在测试 JVM 中的 sun.misc.Unsafe::allocateMemory 警告
            '-Dio.netty.tryReflectionSetAccessible=false',
            '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
            '--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED'
        ]
        // --sun-misc-unsafe-memory-access=allow 仅 JDK 23+ 支持，低版本（17/21）不识别该选项
        if (JavaVersion.current() >= JavaVersion.VERSION_23) {
            baseArgs += '--sun-misc-unsafe-memory-access=allow'
        }
        jvmArgs(baseArgs)
        maxParallelForks = Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))
    }

    sourceSets {
        test {
            java {
                // Database-backed Spring integration tests are excluded from the default release gate.
                exclude 'app/keystone/integrationTest/**'
            }
        }
    }

    tasks.named('jacocoTestReport') {
        dependsOn(tasks.named('test'))
        reports {
            xml.required = true
            csv.required = false
            html.required = true
        }
    }

    tasks.named('check') {
        dependsOn(tasks.named('jacocoTestReport'))
        dependsOn(tasks.named('checkstyleMain'))
        dependsOn(tasks.named('checkstyleTest'))
        dependsOn(tasks.named('spotbugsMain'))
        dependsOn(tasks.named('spotbugsTest'))
    }

    // 对应父 POM <dependencies>：所有子模块继承
    dependencies {
        api platform(springBootBom)
        implementation platform(springBootBom)
        compileOnly platform(springBootBom)
        annotationProcessor platform(springBootBom)
        testImplementation platform(springBootBom)
        testRuntimeOnly platform(springBootBom)
        testCompileOnly platform(springBootBom)
        testAnnotationProcessor platform(springBootBom)

        compileOnly 'org.projectlombok:lombok:1.18.38'
        annotationProcessor 'org.projectlombok:lombok:1.18.38'
        testCompileOnly 'org.projectlombok:lombok:1.18.38'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'
        compileOnly 'org.springframework.boot:spring-boot-configuration-processor'
        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
        if (project.name != 'keystone-framework-spring-boot-starter') {
            api 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.5'
        }
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

def frameworkPublicationDescriptions = [
    'keystone-common': 'Keystone framework common utilities, DTOs, enums, and shared configuration',
    'keystone-infrastructure': 'Keystone framework infrastructure, security, cache, MyBatis, and web configuration',
    'keystone-framework-domain': 'Keystone framework domain services and system domain model',
    'keystone-framework-admin': 'Keystone framework admin web layer and security integration',
    'keystone-framework-spring-boot-starter': 'Spring Boot starter that aggregates Keystone framework modules'
]

configure([
    project(':keystone-common'),
    project(':keystone-infrastructure'),
    project(':keystone-framework-domain'),
    project(':keystone-framework-admin'),
    project(':keystone-framework-spring-boot-starter')
]) {
    def publicationName = project.name
    def publicationDescription = frameworkPublicationDescriptions[publicationName]

    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    java {
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                versionMapping {
                    usage('java-api') {
                        fromResolutionOf('runtimeClasspath')
                    }
                    usage('java-runtime') {
                        fromResolutionResult()
                    }
                }

                pom {
                    name = "app.keystone:${publicationName}"
                    description = publicationDescription
                    url = 'https://github.com/bruceblink/Keystone'
                    inceptionYear = '2022'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/license/mit/'
                            distribution = 'repo'
                        }
                    }
                    developers {
                        developer {
                            id = 'bruceblink'
                            name = 'bruceblink'
                            organization = 'bruceblink'
                            organizationUrl = 'https://github.com/bruceblink'
                        }
                    }
                    scm {
                        connection = 'scm:git:https://github.com/bruceblink/Keystone.git'
                        developerConnection = 'scm:git:ssh://git@github.com/bruceblink/Keystone.git'
                        url = 'https://github.com/bruceblink/Keystone'
                    }
                }
            }
        }

        repositories {
            maven {
                name = findProperty('keystonePublishRepositoryName') ?: 'keystone'
                url = uri(findProperty('keystonePublishUrl')
                    ?: System.getenv('KEYSTONE_PUBLISH_URL')
                    ?: "${rootProject.buildDir}/maven-repository")
                def publishUsername = findProperty('keystonePublishUsername') ?: System.getenv('KEYSTONE_PUBLISH_USERNAME')
                def publishPassword = findProperty('keystonePublishPassword') ?: System.getenv('KEYSTONE_PUBLISH_PASSWORD')
                if (publishUsername && publishPassword) {
                    credentials {
                        username = publishUsername
                        password = publishPassword
                    }
                }
            }
        }
    }

    def signingKey = findProperty('signingInMemoryKey') ?: System.getenv('SIGNING_IN_MEMORY_KEY')
    def signingPassword = findProperty('signingInMemoryKeyPassword') ?: System.getenv('SIGNING_IN_MEMORY_KEY_PASSWORD')
    def signingRequired = Boolean.parseBoolean(String.valueOf(
        findProperty('keystoneSigningRequired') ?: System.getenv('KEYSTONE_SIGNING_REQUIRED') ?: 'false'
    ))

    signing {
        required = { signingRequired || signingKey }
        if (signingKey) {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
        sign publishing.publications.mavenJava
    }

    tasks.withType(org.gradle.plugins.signing.Sign).configureEach {
        onlyIf { signingRequired || signingKey }
    }
}
